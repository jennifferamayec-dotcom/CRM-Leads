<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Leads — Terrenos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16233D;
    --bg-line: rgba(255,255,255,0.05);
    --surface: #F7F4EC;
    --surface-alt: #EFE8D6;
    --ink: #1B2A4A;
    --ink-soft: #5B6B85;
    --accent: #E8722C;
    --accent-soft: #F4C99A;
    --success: #3F7855;
    --success-soft: #D9E8DD;
    --danger: #B8503A;
    --danger-soft: #F1DCD3;
    --line: #C9BFA5;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  @keyframes rise-in {
    from { opacity: 0; transform: translate3d(0, 14px, 0) scale(0.985); }
    to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes atmosphere-drift {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(1.5%, -1%, 0) scale(1.04); }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 14% 8%, rgba(68,112,158,0.26), transparent 32%),
      radial-gradient(circle at 86% 78%, rgba(232,114,44,0.12), transparent 28%),
      linear-gradient(var(--bg-line) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, var(--bg-line) 1px, transparent 1px) 0 0 / 28px 100%,
      var(--bg);
    color: var(--surface);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 28px 32px 60px;
    position: relative;
    isolation: isolate;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -12%;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.055), transparent 58%);
    animation: atmosphere-drift 18s ease-in-out infinite;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 20px;
    animation: rise-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    box-shadow: 0 18px 40px rgba(3,10,24,0.14);
  }

  header.top h1 {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
    color: var(--surface);
  }

  header.top .sub {
    color: #9FB0C9;
    font-size: 13px;
    margin: 0;
  }

  .top-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    animation: fade-in 500ms 120ms ease-out both;
  }

  input[type="text"], select, textarea, input[type="number"] {
    font-family: var(--sans);
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .search-box {
    width: 200px;
  }

  button {
    position: relative;
    isolation: isolate;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-radius: 7px;
    border: 1px solid transparent;
    padding: 9px 16px;
    overflow: hidden;
    transform: translate3d(0, 0, 0);
    transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1), opacity 220ms ease, box-shadow 220ms cubic-bezier(0.22, 1, 0.36, 1), border-color 220ms ease;
    box-shadow: 0 2px 0 rgba(10,15,26,0.26), 0 5px 12px rgba(10,15,26,0.12);
  }
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 48%);
    pointer-events: none;
  }
  button:hover {
    opacity: 1;
    transform: translate3d(0, -2px, 0);
    box-shadow: 0 4px 0 rgba(10,15,26,0.24), 0 10px 18px rgba(10,15,26,0.18);
  }
  button:active {
    transform: translate3d(0, 1px, 0);
    box-shadow: 0 1px 0 rgba(10,15,26,0.2), 0 2px 5px rgba(10,15,26,0.12);
  }
  button:focus-visible {
    outline: 3px solid rgba(244,201,154,0.72);
    outline-offset: 2px;
  }

  .btn-primary { background: var(--accent); color: #fff; border-color: #d45f1d; }
  .btn-ghost { background: rgba(255,255,255,0.04); color: var(--surface); border-color: rgba(255,255,255,0.3); }
  .btn-danger { background: var(--danger); color: #fff; border-color: #9d402f; }
  .btn-secondary { background: var(--surface-alt); color: var(--ink); border-color: #d8cdb5; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--ink);
    animation: rise-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    box-shadow: 0 10px 22px rgba(3,10,24,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .stat-card:nth-child(2) { animation-delay: 80ms; }
  .stat-card:nth-child(3) { animation-delay: 160ms; }
  .stat-card:nth-child(4) { animation-delay: 240ms; }
  .stat-card:hover {
    transform: translateY(-3px);
    transition: transform 180ms ease;
  }

  .stat-card .value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
  }

  .stat-card .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .board {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 20px;
  }

  .lead-list-section {
    margin-top: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    padding: 16px;
    animation: rise-in 560ms 180ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .section-heading h2 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    margin: 0;
    color: var(--surface);
  }

  .section-heading span { color: #9FB0C9; font-size: 12px; }
  .table-wrap { overflow-x: auto; }

  .lead-table {
    width: 100%;
    min-width: 620px;
    border-collapse: collapse;
    color: var(--surface);
    font-size: 12px;
  }

  .lead-table th {
    color: #9FB0C9;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-align: left;
    text-transform: uppercase;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.16);
  }

  .lead-table td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    vertical-align: top;
  }

  .lead-table tbody tr { cursor: pointer; transition: background 180ms ease; }
  .lead-table tbody tr:hover { background: rgba(255,255,255,0.08); }
  .lead-table .table-name { font-weight: 600; color: var(--surface); }
  .lead-table .table-muted { color: #9FB0C9; }
  .table-empty { color: #9FB0C9; padding: 14px 10px; text-align: center; }

  .column {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    min-width: 260px;
    max-width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 260px);
    animation: rise-in 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
    box-shadow: 0 16px 30px rgba(3,10,24,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .column:nth-child(2) { animation-delay: 60ms; }
  .column:nth-child(3) { animation-delay: 120ms; }
  .column:nth-child(4) { animation-delay: 180ms; }
  .column:nth-child(5) { animation-delay: 240ms; }
  .column:nth-child(6) { animation-delay: 300ms; }
  .column:nth-child(7) { animation-delay: 360ms; }
  .column:nth-child(8) { animation-delay: 420ms; }

  .column-head {
    padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  .column-head .stage-name {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .column-head .count-pill {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 11px;
  }

  .column-body {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .lead-card {
    background: var(--surface);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    border-left: 3px solid var(--accent);
    animation: rise-in 400ms cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
  }
  .lead-card:hover {
    background: var(--surface-alt);
    transform: translateX(3px);
    box-shadow: 0 5px 12px rgba(27,42,74,0.12);
  }

  .lead-card .name {
    font-weight: 600;
    font-size: 13.5px;
    margin-bottom: 3px;
  }

  .lead-card .meta {
    font-size: 11.5px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .origin-tag {
    display: inline-block;
    font-size: 10px;
    font-family: var(--mono);
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--surface-alt);
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .empty-col {
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    text-align: center;
    padding: 20px 8px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #9FB0C9;
  }
  .empty-state h2 {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--surface);
    font-size: 18px;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,26,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
  }

  .modal h2 {
    font-family: var(--mono);
    font-size: 17px;
    margin: 0 0 16px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 56px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .stage-move {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .stage-move button { flex: 1; padding: 7px 8px; font-size: 12px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .cloud-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #9FB0C9;
    font-family: var(--mono);
    font-size: 10px;
    white-space: nowrap;
  }
  .cloud-status::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9FB0C9;
  }
  .cloud-status.online::before { background: var(--success); }
  .cloud-status.offline::before { background: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 640px) {
    body { padding: 18px 12px 50px; }
    header.top h1 { font-size: 18px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    header.top { flex-direction: column; align-items: stretch; }
    .top-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .top-actions input,
    .top-actions select,
    .top-actions button { width: 100%; }
    .board { display: flex; flex-direction: column; gap: 10px; overflow-x: visible; }
    .lead-list-section { padding: 12px; }
    .section-heading { align-items: flex-start; flex-direction: column; gap: 4px; }
    .column {
      min-width: 0;
      max-width: none;
      width: 100%;
      max-height: none;
    }
    .column-body { overflow-y: visible; }
    .field-row { grid-template-columns: 1fr; gap: 0; }
    .modal { padding: 18px; max-height: 92vh; }
    .modal-actions { flex-wrap: wrap; }
    .modal-actions > div { width: 100%; }
    .modal-actions > div button { flex: 1; }
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Panel de Leads — Terrenos</h1>
    <p class="sub">De lead a cliente, por etapa</p>
  </div>
  <div class="top-actions">
    <input type="text" id="searchBox" class="search-box" placeholder="Buscar nombre o teléfono...">
    <select id="originFilter">
      <option value="">Todos los orígenes</option>
      <option value="Pauta">Pauta</option>
      <option value="TikTok Live">TikTok Live</option>
      <option value="Orgánico">Orgánico</option>
      <option value="Otro">Otro</option>
    </select>
    <button class="btn-secondary" id="syncBtn">Sincronizar con Sheets</button>
    <button class="btn-secondary" id="exportBtn">Exportar a LEADS_MAESTRO</button>
    <button class="btn-primary" id="addLeadBtn">+ Nuevo lead</button>
    <span class="cloud-status" id="cloudStatus">Conectando nube...</span>
  </div>
</header>

<div class="stats" id="statsRow"></div>

<div class="board" id="board"></div>

<section class="lead-list-section" id="leadListSection" style="display:none;">
  <div class="section-heading">
    <h2>Usuarios registrados en la nube</h2>
    <span id="leadListCount"></span>
  </div>
  <div class="table-wrap">
    <table class="lead-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Origen</th>
          <th>Terreno</th>
          <th>Presupuesto</th>
          <th>Etapa</th>
        </tr>
      </thead>
      <tbody id="leadListBody"></tbody>
    </table>
  </div>
</section>

<div id="emptyState" class="empty-state" style="display:none;">
  <h2>Todavía no tienes leads</h2>
  <p>Agrega el primero con el botón "+ Nuevo lead" de arriba.</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'terrenos-crm-leads';
const API_URL = '/api/leads';

const STAGES = [
  { key: 'nuevo', label: 'Nuevo' },
  { key: 'contactado', label: 'Contactado' },
  { key: 'calificado', label: 'Calificado' },
  { key: 'visita_agendada', label: 'Visita agendada' },
  { key: 'visita_realizada', label: 'Visita realizada' },
  { key: 'negociando', label: 'Negociando' },
  { key: 'ganado', label: 'Cerrado — Ganado' },
  { key: 'perdido', label: 'Cerrado — Perdido' }
];

let leads = [];
let editingId = null;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function setCloudStatus(online) {
  const status = document.getElementById('cloudStatus');
  status.textContent = online ? 'Nube conectada' : 'Nube sin conexión';
  status.classList.toggle('online', online);
  status.classList.toggle('offline', !online);
}

async function loadLeads(showError = true) {
  try {
    const response = await fetch(API_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('No se pudo consultar la nube.');
    const result = await response.json();
    setCloudStatus(true);
    const nextLeads = Array.isArray(result.leads) ? result.leads : [];
    const changed = JSON.stringify(nextLeads) !== JSON.stringify(leads);
    leads = nextLeads;
    if (changed || !document.getElementById('board').innerHTML) render();
    return;
  } catch (err) {
    setCloudStatus(false);
    if (showError) showToast('No se pudo conectar con la nube.');
  }
  render();
}

async function saveLead(lead) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead })
    });
    if (!response.ok) throw new Error('No se pudo guardar en la nube.');
    setCloudStatus(true);
  } catch (err) {
    setCloudStatus(false);
    showToast('No se pudo guardar. Verifica la conexión cloud de Vercel.');
    throw err;
  }
}

async function deleteLead(id) {
  const response = await fetch(`${API_URL}?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
  if (!response.ok) throw new Error('No se pudo eliminar en la nube.');
}

setInterval(() => {
  if (!editingId) {
    loadLeads(false);
    syncFromSheet(false);
  }
}, 10000);

function formatCurrency(n) {
  if (!n && n !== 0) return '';
  const text = String(n).trim();
  const numericValue = Number(text.replace(/,/g, ''));
  if (!Number.isFinite(numericValue)) return escapeHtml(text);
  return '$' + numericValue.toLocaleString('es-CO');
}

function daysAgo(dateStr) {
  if (!dateStr) return null;
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / (1000 * 60 * 60 * 24));
  return diff;
}

function renderStats() {
  const activos = leads.filter(l => l.stage !== 'ganado' && l.stage !== 'perdido').length;
  const ganados = leads.filter(l => l.stage === 'ganado');
  const perdidos = leads.filter(l => l.stage === 'perdido').length;
  const totalCierres = ganados.length + perdidos;
  const tasaCierre = totalCierres > 0 ? Math.round((ganados.length / totalCierres) * 100) : 0;
  const valorPotencial = leads
    .filter(l => l.stage !== 'perdido')
    .reduce((sum, l) => sum + (Number(l.presupuesto) || 0), 0);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="value">${leads.length}</div><div class="label">Total leads</div></div>
    <div class="stat-card"><div class="value">${activos}</div><div class="label">Activos en el embudo</div></div>
    <div class="stat-card"><div class="value">${tasaCierre}%</div><div class="label">Tasa de cierre</div></div>
    <div class="stat-card"><div class="value">${formatCurrency(valorPotencial)}</div><div class="label">Valor potencial activo</div></div>
  `;
}

function getFilteredLeads() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const origin = document.getElementById('originFilter').value;
  return leads.filter(l => {
    const matchesSearch = !search || l.name.toLowerCase().includes(search) || (l.phone || '').includes(search);
    const matchesOrigin = !origin || l.origin === origin;
    return matchesSearch && matchesOrigin;
  });
}

function render() {
  renderStats();
  const filtered = getFilteredLeads();
  renderLeadList(filtered);
  const board = document.getElementById('board');
  const empty = document.getElementById('emptyState');

  if (leads.length === 0) {
    board.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  board.style.display = 'flex';
  empty.style.display = 'none';

  board.innerHTML = STAGES.map(stage => {
    const stageLeads = filtered.filter(l => l.stage === stage.key);
    const cardsHtml = stageLeads.length
      ? stageLeads.map(l => `
        <div class="lead-card" data-id="${l.id}">
          <div class="name">${escapeHtml(l.name)}</div>
          <div class="meta">
            ${l.phone ? `<span>${escapeHtml(l.phone)}</span>` : ''}
            ${l.presupuesto ? `<span>${formatCurrency(l.presupuesto)}</span>` : ''}
          </div>
          ${l.terreno ? `<div class="meta">${escapeHtml(l.terreno)}</div>` : ''}
          ${l.origin ? `<span class="origin-tag">${escapeHtml(l.origin)}</span>` : ''}
        </div>
      `).join('')
      : `<div class="empty-col">Sin leads aquí</div>`;

    return `
      <div class="column">
        <div class="column-head">
          <div class="stage-name">
            <span>${stage.label}</span>
            <span class="count-pill">${stageLeads.length}</span>
          </div>
        </div>
        <div class="column-body">${cardsHtml}</div>
      </div>
    `;
  }).join('');

  board.querySelectorAll('.lead-card').forEach(card => {
    card.addEventListener('click', () => openEditModal(card.dataset.id));
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderLeadList(filtered) {
  const section = document.getElementById('leadListSection');
  const body = document.getElementById('leadListBody');
  const count = document.getElementById('leadListCount');
  section.style.display = leads.length ? 'block' : 'none';
  count.textContent = `${filtered.length} visible(s) de ${leads.length}`;

  body.innerHTML = filtered.length
    ? filtered.map(lead => {
      const stage = STAGES.find(item => item.key === lead.stage);
      return `
        <tr data-id="${escapeHtml(lead.id)}">
          <td class="table-name">${escapeHtml(lead.name)}</td>
          <td>${escapeHtml(lead.phone || '-')}</td>
          <td>${escapeHtml(lead.origin || '-')}</td>
          <td>${escapeHtml(lead.terreno || '-')}</td>
          <td>${lead.presupuesto ? formatCurrency(lead.presupuesto) : '-'}</td>
          <td class="table-muted">${escapeHtml(stage ? stage.label : lead.stage || '-')}</td>
        </tr>
      `;
    }).join('')
    : '<tr><td class="table-empty" colspan="6">No hay usuarios con estos filtros.</td></tr>';

  body.querySelectorAll('tr[data-id]').forEach(row => {
    row.addEventListener('click', () => openEditModal(row.dataset.id));
  });
}

function originOptions(selected) {
  return ['Pauta', 'TikTok Live', 'Orgánico', 'Otro'].map(o =>
    `<option value="${o}" ${o === selected ? 'selected' : ''}>${o}</option>`
  ).join('');
}

function stageOptions(selected) {
  return STAGES.map(s =>
    `<option value="${s.key}" ${s.key === selected ? 'selected' : ''}>${s.label}</option>`
  ).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalContent').innerHTML = `
    <h2>Nuevo lead</h2>
    ${leadFormHtml({})}
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn-primary" id="saveBtn">Guardar lead</button>
    </div>
  `;
  bindModalEvents();
  document.getElementById('overlay').classList.add('open');
}

function openEditModal(id) {
  const lead = leads.find(l => l.id === id);
  if (!lead) return;
  editingId = id;
  const lastContactInfo = lead.lastContact
    ? `Último contacto hace ${daysAgo(lead.lastContact)} día(s)`
    : 'Sin contacto registrado';

  document.getElementById('modalContent').innerHTML = `
    <h2>${escapeHtml(lead.name)}</h2>
    ${leadFormHtml(lead)}
    <div class="field">
      <label>Mover de etapa (${lastContactInfo})</label>
      <div class="stage-move">
        <button class="btn-secondary" id="prevStage">← Etapa anterior</button>
        <button class="btn-secondary" id="nextStage">Siguiente etapa →</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn">Eliminar</button>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost" id="cancelBtn">Cerrar</button>
        <button class="btn-primary" id="saveBtn">Guardar cambios</button>
      </div>
    </div>
  `;
  bindModalEvents();
  document.getElementById('overlay').classList.add('open');
}

function leadFormHtml(lead) {
  return `
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="f_name" value="${escapeHtml(lead.name || '')}" placeholder="Ej. Juan Pérez">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Teléfono</label>
        <input type="text" id="f_phone" value="${escapeHtml(lead.phone || '')}" placeholder="+57 300 000 0000">
      </div>
      <div class="field">
        <label>Origen</label>
        <select id="f_origin">${originOptions(lead.origin)}</select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Terreno de interés</label>
        <input type="text" id="f_terreno" value="${escapeHtml(lead.terreno || '')}" placeholder="Ej. Lote 12 - Zona Norte">
      </div>
      <div class="field">
        <label>Presupuesto (COP)</label>
        <input type="number" id="f_presupuesto" value="${lead.presupuesto || ''}" placeholder="50000000">
      </div>
    </div>
    <div class="field">
      <label>Etapa</label>
      <select id="f_stage">${stageOptions(lead.stage || 'nuevo')}</select>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="f_notas" placeholder="Objeciones, detalles de la última llamada...">${escapeHtml(lead.notas || '')}</textarea>
    </div>
  `;
}

function bindModalEvents() {
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', saveFromModal);

  const deleteBtn = document.getElementById('deleteBtn');
  if (deleteBtn) deleteBtn.addEventListener('click', deleteFromModal);

  const prevBtn = document.getElementById('prevStage');
  const nextBtn = document.getElementById('nextStage');
  if (prevBtn) prevBtn.addEventListener('click', () => shiftStage(-1));
  if (nextBtn) nextBtn.addEventListener('click', () => shiftStage(1));
}

function shiftStage(direction) {
  const stageSelect = document.getElementById('f_stage');
  const currentIndex = STAGES.findIndex(s => s.key === stageSelect.value);
  const newIndex = Math.min(Math.max(currentIndex + direction, 0), STAGES.length - 1);
  stageSelect.value = STAGES[newIndex].key;
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

async function saveFromModal() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) {
    showToast('El nombre es obligatorio.');
    return;
  }
  const data = {
    name,
    phone: document.getElementById('f_phone').value.trim(),
    origin: document.getElementById('f_origin').value,
    terreno: document.getElementById('f_terreno').value.trim(),
    presupuesto: document.getElementById('f_presupuesto').value,
    stage: document.getElementById('f_stage').value,
    notas: document.getElementById('f_notas').value.trim(),
    lastContact: new Date().toISOString()
  };

  if (editingId) {
    const idx = leads.findIndex(l => l.id === editingId);
    if (idx > -1) leads[idx] = { ...leads[idx], ...data };
    await saveLead(leads[idx]);
    await pushToSheet(leads[idx]);
    closeModal();
    render();
    showToast('Lead actualizado.');
  } else {
    const newLead = { id: uid(), createdAt: new Date().toISOString(), ...data };
    leads.push(newLead);
    await saveLead(newLead);
    await pushToSheet(newLead);
    closeModal();
    render();
  }
  return;
}

async function deleteFromModal() {
  if (!editingId) return;
  try {
    await deleteLead(editingId);
  } catch (err) {
    showToast('No se pudo eliminar. Verifica la conexión cloud de Vercel.');
    return;
  }
  leads = leads.filter(l => l.id !== editingId);
  closeModal();
  render();
  showToast('Lead eliminado.');
}

function exportToCSV() {
  if (leads.length === 0) {
    showToast('No hay leads para exportar todavía.');
    return;
  }
  const stageLabel = (key) => {
    const s = STAGES.find(st => st.key === key);
    return s ? s.label : key;
  };
  const headers = ['Nombre', 'Telefono', 'Origen', 'Terreno_interes', 'Presupuesto', 'Etapa', 'Notas', 'Ultimo_contacto', 'Fecha_creacion'];
  const rows = leads.map(l => [
    l.name || '',
    l.phone || '',
    l.origin || '',
    l.terreno || '',
    l.presupuesto || '',
    stageLabel(l.stage),
    (l.notas || '').replace(/\n/g, ' '),
    l.lastContact ? l.lastContact.split('T')[0] : '',
    l.createdAt ? l.createdAt.split('T')[0] : ''
  ]);

  const csvContent = [headers, ...rows]
    .map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `LEADS_MAESTRO_export_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('Archivo descargado. Impórtalo en tu hoja LEADS_MAESTRO.');
}

const SYNC_URL_KEY = 'sheet-sync-url';
const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzqFdN-WMVSRt2lXlM3NJ7XRgYZ0JNUZCIemr-VlOttR1W7dR4OVFkaiXJGQPw40g_i/exec';
let sheetSyncInProgress = false;

async function getSyncUrl() {
  const savedUrl = localStorage.getItem(SYNC_URL_KEY) || '';
  if (!savedUrl || savedUrl.includes('AKfycbx2VYBBwIAhB39ha0AvSHx0i32vUVSCNyMOOb1I0ssN7EcZA4qIn-mNmK2hL6dq0xOF')) {
    localStorage.setItem(SYNC_URL_KEY, DEFAULT_SHEET_URL);
    return DEFAULT_SHEET_URL;
  }
  return savedUrl;
}

async function configureSync() {
  const currentUrl = await getSyncUrl();
  const currentKey = await getSyncKey();
  const url = window.prompt(
    'Pega aquí la URL de tu Apps Script (termina en /exec).\nDéjalo vacío y acepta para desactivar la sincronización.',
    currentUrl
  );
  if (url === null) return;
  const key = url.trim() ? window.prompt('Ahora pega la clave secreta que puso en el código (CLAVE_SECRETA):', currentKey) : '';
  localStorage.setItem(SYNC_URL_KEY, url.trim());
  localStorage.setItem(SYNC_KEY_KEY, (key || '').trim());
  showToast(url.trim() ? 'Sincronización configurada.' : 'Sincronización desactivada.');
  if (url.trim()) await syncFromSheet();
}

const SYNC_KEY_KEY = 'sheet-sync-secret';

async function getSyncKey() {
  return localStorage.getItem(SYNC_KEY_KEY) || 'crm-terrenos-2026-cambia-esta-clave';
}

function sheetLeadToCrm(row) {
  return {
    id: String(row.id || row.identificacion || row['Cliente / Contacto'] || uid()),
    name: row.name || row.nombre || row['Cliente / Contacto'] || '',
    phone: row.phone || row.contacto || row.CONTACTO || '',
    origin: row.origin || row.origen || row['Origen / Canal'] || '',
    terreno: row.terreno || row.interes || row.intereses || '',
    presupuesto: row.presupuesto || row['Interés'] || row.interes || '',
    stage: row.stage || row.etapa || row.Resultado || 'nuevo',
    notas: row.notas || row.nota || row['Último Mensaje / Nota'] || '',
    lastContact: row.lastContact || row.fecha || row['Fecha 1 CONTACTO'] || '',
    createdAt: row.createdAt || row.fecha_creacion || new Date().toISOString()
  };
}

async function syncFromSheet(showMessage = true) {
  if (sheetSyncInProgress || editingId) return;
  const url = await getSyncUrl();
  if (!url) return;
  sheetSyncInProgress = true;
  try {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('Google Sheets respondió con un error.');
    const result = await response.json();
    if (!result.ok && result.error) throw new Error(result.error);
    if (!Array.isArray(result.leads)) throw new Error('Respuesta inválida de Google Sheets.');
    leads = result.leads.map(sheetLeadToCrm).filter(lead => lead.name);
    await Promise.all(leads.map(saveLead));
    render();
    if (showMessage) showToast(`${leads.length} lead(s) importado(s) desde Sheets.`);
  } catch (err) {
    showToast('No se pudo leer Google Sheets. Revisa que la implementación sea pública.');
  } finally {
    sheetSyncInProgress = false;
  }
}

async function pushToSheet(lead) {
  const url = await getSyncUrl();
  if (!url) return;
  const key = await getSyncKey();
  try {
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        clave: key || '',
        id: lead.id || '',
        identificacion: lead.id || '',
        'Cliente / Contacto': lead.name || '',
        'Origen / Canal': lead.origin || '',
        'Fecha 1 CONTACTO': lead.lastContact ? lead.lastContact.split('T')[0] : '',
        Financiamiento: '',
        'Interés': lead.presupuesto || '',
        'Último Mensaje / Nota': lead.notas || '',
        CONTACTO: lead.phone || '',
        t_Movin: '',
        Resultado: lead.stage || 'En proceso',
        nombre: lead.name || '',
        origen: lead.origin || '',
        fecha: lead.lastContact ? lead.lastContact.split('T')[0] : '',
        fecha_creacion: lead.createdAt || '',
        financiamiento: '',
        interes: lead.presupuesto || '',
        etapa: lead.stage || 'nuevo',
        terreno: lead.terreno || '',
        nota: lead.notas || '',
        contacto: lead.phone || '',
        tmovin: '',
        resultado: 'En proceso'
      })
    });
    showToast('Lead guardado en Vercel y enviado a Google Sheets.');
  } catch (err) {
    showToast('Lead guardado aquí, pero no se pudo enviar a Sheets.');
  }
}

document.getElementById('syncBtn').addEventListener('click', configureSync);
document.getElementById('syncBtn').addEventListener('click', () => syncFromSheet());
document.getElementById('addLeadBtn').addEventListener('click', openAddModal);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('originFilter').addEventListener('change', render);
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

loadLeads().then(() => syncFromSheet(false));
</script>
