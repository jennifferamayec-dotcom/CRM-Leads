<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Leads — Terrenos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16233D;
    --bg-line: rgba(255,255,255,0.05);
    --surface: #F7F4EC;
    --surface-alt: #EFE8D6;
    --ink: #1B2A4A;
    --ink-soft: #5B6B85;
    --accent: #E8722C;
    --accent-soft: #F4C99A;
    --success: #3F7855;
    --success-soft: #D9E8DD;
    --danger: #B8503A;
    --danger-soft: #F1DCD3;
    --line: #C9BFA5;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(var(--bg-line) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, var(--bg-line) 1px, transparent 1px) 0 0 / 28px 100%,
      var(--bg);
    color: var(--surface);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 28px 32px 60px;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 20px;
  }

  header.top h1 {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
    color: var(--surface);
  }

  header.top .sub {
    color: #9FB0C9;
    font-size: 13px;
    margin: 0;
  }

  .top-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  input[type="text"], select, textarea, input[type="number"] {
    font-family: var(--sans);
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .search-box {
    width: 200px;
  }

  button {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
    padding: 9px 16px;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; color: var(--surface); border: 1px solid rgba(255,255,255,0.3); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-secondary { background: var(--surface-alt); color: var(--ink); }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--ink);
  }

  .stat-card .value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
  }

  .stat-card .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .board {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 20px;
  }

  .column {
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(255,255,255,0.18);
    border-radius: 10px;
    min-width: 260px;
    max-width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 260px);
  }

  .column-head {
    padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  .column-head .stage-name {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .column-head .count-pill {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 11px;
  }

  .column-body {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .lead-card {
    background: var(--surface);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    border-left: 3px solid var(--accent);
  }
  .lead-card:hover { background: var(--surface-alt); }

  .lead-card .name {
    font-weight: 600;
    font-size: 13.5px;
    margin-bottom: 3px;
  }

  .lead-card .meta {
    font-size: 11.5px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
  }

  .origin-tag {
    display: inline-block;
    font-size: 10px;
    font-family: var(--mono);
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--surface-alt);
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .empty-col {
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    text-align: center;
    padding: 20px 8px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #9FB0C9;
  }
  .empty-state h2 {
    font-family: var(--mono);
    font-weight: 500;
    color: var(--surface);
    font-size: 18px;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,26,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px;
  }

  .modal h2 {
    font-family: var(--mono);
    font-size: 17px;
    margin: 0 0 16px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 56px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .stage-move {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .stage-move button { flex: 1; padding: 7px 8px; font-size: 12px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 640px) {
    body { padding: 18px 12px 50px; }
    header.top h1 { font-size: 18px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    header.top { flex-direction: column; align-items: stretch; }
    .top-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .top-actions input,
    .top-actions select,
    .top-actions button { width: 100%; }
    .board { display: flex; flex-direction: column; gap: 10px; overflow-x: visible; }
    .column {
      min-width: 0;
      max-width: none;
      width: 100%;
      max-height: none;
    }
    .column-body { overflow-y: visible; }
    .field-row { grid-template-columns: 1fr; gap: 0; }
    .modal { padding: 18px; max-height: 92vh; }
    .modal-actions { flex-wrap: wrap; }
    .modal-actions > div { width: 100%; }
    .modal-actions > div button { flex: 1; }
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Panel de Leads — Terrenos</h1>
    <p class="sub">De lead a cliente, por etapa</p>
  </div>
  <div class="top-actions">
    <input type="text" id="searchBox" class="search-box" placeholder="Buscar nombre o teléfono...">
    <select id="originFilter">
      <option value="">Todos los orígenes</option>
      <option value="Pauta">Pauta</option>
      <option value="TikTok Live">TikTok Live</option>
      <option value="Orgánico">Orgánico</option>
      <option value="Otro">Otro</option>
    </select>
    <button class="btn-secondary" id="syncBtn">Sincronizar con Sheets</button>
    <button class="btn-secondary" id="exportBtn">Exportar a LEADS_MAESTRO</button>
    <button class="btn-primary" id="addLeadBtn">+ Nuevo lead</button>
  </div>
</header>

<div class="stats" id="statsRow"></div>

<div class="board" id="board"></div>

<div id="emptyState" class="empty-state" style="display:none;">
  <h2>Todavía no tienes leads</h2>
  <p>Agrega el primero con el botón "+ Nuevo lead" de arriba.</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'terrenos-crm-leads';

const STAGES = [
  { key: 'nuevo', label: 'Nuevo' },
  { key: 'contactado', label: 'Contactado' },
  { key: 'calificado', label: 'Calificado' },
  { key: 'visita_agendada', label: 'Visita agendada' },
  { key: 'visita_realizada', label: 'Visita realizada' },
  { key: 'negociando', label: 'Negociando' },
  { key: 'ganado', label: 'Cerrado — Ganado' },
  { key: 'perdido', label: 'Cerrado — Perdido' }
];

let leads = [];
let editingId = null;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function loadLeads() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    leads = result && result.value ? JSON.parse(result.value) : [];
  } catch (err) {
    leads = [];
  }
  render();
}

async function saveLeads() {
  try {
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(leads), false);
    if (!result) showToast('No se pudo guardar. Intenta de nuevo.');
  } catch (err) {
    showToast('Error al guardar los datos.');
  }
}

function formatCurrency(n) {
  if (!n && n !== 0) return '';
  return '$' + Number(n).toLocaleString('es-CO');
}

function daysAgo(dateStr) {
  if (!dateStr) return null;
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / (1000 * 60 * 60 * 24));
  return diff;
}

function renderStats() {
  const activos = leads.filter(l => l.stage !== 'ganado' && l.stage !== 'perdido').length;
  const ganados = leads.filter(l => l.stage === 'ganado');
  const perdidos = leads.filter(l => l.stage === 'perdido').length;
  const totalCierres = ganados.length + perdidos;
  const tasaCierre = totalCierres > 0 ? Math.round((ganados.length / totalCierres) * 100) : 0;
  const valorPotencial = leads
    .filter(l => l.stage !== 'perdido')
    .reduce((sum, l) => sum + (Number(l.presupuesto) || 0), 0);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="value">${leads.length}</div><div class="label">Total leads</div></div>
    <div class="stat-card"><div class="value">${activos}</div><div class="label">Activos en el embudo</div></div>
    <div class="stat-card"><div class="value">${tasaCierre}%</div><div class="label">Tasa de cierre</div></div>
    <div class="stat-card"><div class="value">${formatCurrency(valorPotencial)}</div><div class="label">Valor potencial activo</div></div>
  `;
}

function getFilteredLeads() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const origin = document.getElementById('originFilter').value;
  return leads.filter(l => {
    const matchesSearch = !search || l.name.toLowerCase().includes(search) || (l.phone || '').includes(search);
    const matchesOrigin = !origin || l.origin === origin;
    return matchesSearch && matchesOrigin;
  });
}

function render() {
  renderStats();
  const filtered = getFilteredLeads();
  const board = document.getElementById('board');
  const empty = document.getElementById('emptyState');

  if (leads.length === 0) {
    board.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  board.style.display = 'flex';
  empty.style.display = 'none';

  board.innerHTML = STAGES.map(stage => {
    const stageLeads = filtered.filter(l => l.stage === stage.key);
    const cardsHtml = stageLeads.length
      ? stageLeads.map(l => `
        <div class="lead-card" data-id="${l.id}">
          <div class="name">${escapeHtml(l.name)}</div>
          <div class="meta">
            ${l.phone ? `<span>${escapeHtml(l.phone)}</span>` : ''}
            ${l.presupuesto ? `<span>${formatCurrency(l.presupuesto)}</span>` : ''}
          </div>
          ${l.terreno ? `<div class="meta">${escapeHtml(l.terreno)}</div>` : ''}
          ${l.origin ? `<span class="origin-tag">${escapeHtml(l.origin)}</span>` : ''}
        </div>
      `).join('')
      : `<div class="empty-col">Sin leads aquí</div>`;

    return `
      <div class="column">
        <div class="column-head">
          <div class="stage-name">
            <span>${stage.label}</span>
            <span class="count-pill">${stageLeads.length}</span>
          </div>
        </div>
        <div class="column-body">${cardsHtml}</div>
      </div>
    `;
  }).join('');

  board.querySelectorAll('.lead-card').forEach(card => {
    card.addEventListener('click', () => openEditModal(card.dataset.id));
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function originOptions(selected) {
  return ['Pauta', 'TikTok Live', 'Orgánico', 'Otro'].map(o =>
    `<option value="${o}" ${o === selected ? 'selected' : ''}>${o}</option>`
  ).join('');
}

function stageOptions(selected) {
  return STAGES.map(s =>
    `<option value="${s.key}" ${s.key === selected ? 'selected' : ''}>${s.label}</option>`
  ).join('');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalContent').innerHTML = `
    <h2>Nuevo lead</h2>
    ${leadFormHtml({})}
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn-primary" id="saveBtn">Guardar lead</button>
    </div>
  `;
  bindModalEvents();
  document.getElementById('overlay').classList.add('open');
}

function openEditModal(id) {
  const lead = leads.find(l => l.id === id);
  if (!lead) return;
  editingId = id;
  const lastContactInfo = lead.lastContact
    ? `Último contacto hace ${daysAgo(lead.lastContact)} día(s)`
    : 'Sin contacto registrado';

  document.getElementById('modalContent').innerHTML = `
    <h2>${escapeHtml(lead.name)}</h2>
    ${leadFormHtml(lead)}
    <div class="field">
      <label>Mover de etapa (${lastContactInfo})</label>
      <div class="stage-move">
        <button class="btn-secondary" id="prevStage">← Etapa anterior</button>
        <button class="btn-secondary" id="nextStage">Siguiente etapa →</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn">Eliminar</button>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost" id="cancelBtn">Cerrar</button>
        <button class="btn-primary" id="saveBtn">Guardar cambios</button>
      </div>
    </div>
  `;
  bindModalEvents();
  document.getElementById('overlay').classList.add('open');
}

function leadFormHtml(lead) {
  return `
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="f_name" value="${escapeHtml(lead.name || '')}" placeholder="Ej. Juan Pérez">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Teléfono</label>
        <input type="text" id="f_phone" value="${escapeHtml(lead.phone || '')}" placeholder="+57 300 000 0000">
      </div>
      <div class="field">
        <label>Origen</label>
        <select id="f_origin">${originOptions(lead.origin)}</select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Terreno de interés</label>
        <input type="text" id="f_terreno" value="${escapeHtml(lead.terreno || '')}" placeholder="Ej. Lote 12 - Zona Norte">
      </div>
      <div class="field">
        <label>Presupuesto (COP)</label>
        <input type="number" id="f_presupuesto" value="${lead.presupuesto || ''}" placeholder="50000000">
      </div>
    </div>
    <div class="field">
      <label>Etapa</label>
      <select id="f_stage">${stageOptions(lead.stage || 'nuevo')}</select>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="f_notas" placeholder="Objeciones, detalles de la última llamada...">${escapeHtml(lead.notas || '')}</textarea>
    </div>
  `;
}

function bindModalEvents() {
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', saveFromModal);

  const deleteBtn = document.getElementById('deleteBtn');
  if (deleteBtn) deleteBtn.addEventListener('click', deleteFromModal);

  const prevBtn = document.getElementById('prevStage');
  const nextBtn = document.getElementById('nextStage');
  if (prevBtn) prevBtn.addEventListener('click', () => shiftStage(-1));
  if (nextBtn) nextBtn.addEventListener('click', () => shiftStage(1));
}

function shiftStage(direction) {
  const stageSelect = document.getElementById('f_stage');
  const currentIndex = STAGES.findIndex(s => s.key === stageSelect.value);
  const newIndex = Math.min(Math.max(currentIndex + direction, 0), STAGES.length - 1);
  stageSelect.value = STAGES[newIndex].key;
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

async function saveFromModal() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) {
    showToast('El nombre es obligatorio.');
    return;
  }
  const data = {
    name,
    phone: document.getElementById('f_phone').value.trim(),
    origin: document.getElementById('f_origin').value,
    terreno: document.getElementById('f_terreno').value.trim(),
    presupuesto: document.getElementById('f_presupuesto').value,
    stage: document.getElementById('f_stage').value,
    notas: document.getElementById('f_notas').value.trim(),
    lastContact: new Date().toISOString()
  };

  if (editingId) {
    const idx = leads.findIndex(l => l.id === editingId);
    if (idx > -1) leads[idx] = { ...leads[idx], ...data };
    await saveLeads();
    closeModal();
    render();
    showToast('Lead actualizado.');
  } else {
    const newLead = { id: uid(), createdAt: new Date().toISOString(), ...data };
    leads.push(newLead);
    await saveLeads();
    closeModal();
    render();
    await pushToSheet(newLead);
  }
  return;
}

async function deleteFromModal() {
  if (!editingId) return;
  leads = leads.filter(l => l.id !== editingId);
  await saveLeads();
  closeModal();
  render();
  showToast('Lead eliminado.');
}

function exportToCSV() {
  if (leads.length === 0) {
    showToast('No hay leads para exportar todavía.');
    return;
  }
  const stageLabel = (key) => {
    const s = STAGES.find(st => st.key === key);
    return s ? s.label : key;
  };
  const headers = ['Nombre', 'Telefono', 'Origen', 'Terreno_interes', 'Presupuesto', 'Etapa', 'Notas', 'Ultimo_contacto', 'Fecha_creacion'];
  const rows = leads.map(l => [
    l.name || '',
    l.phone || '',
    l.origin || '',
    l.terreno || '',
    l.presupuesto || '',
    stageLabel(l.stage),
    (l.notas || '').replace(/\n/g, ' '),
    l.lastContact ? l.lastContact.split('T')[0] : '',
    l.createdAt ? l.createdAt.split('T')[0] : ''
  ]);

  const csvContent = [headers, ...rows]
    .map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `LEADS_MAESTRO_export_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast('Archivo descargado. Impórtalo en tu hoja LEADS_MAESTRO.');
}

const SYNC_URL_KEY = 'sheet-sync-url';

async function getSyncUrl() {
  try {
    const result = await window.storage.get(SYNC_URL_KEY, false);
    return result && result.value ? result.value : '';
  } catch (err) {
    return '';
  }
}

async function configureSync() {
  const currentUrl = await getSyncUrl();
  const currentKey = await getSyncKey();
  const url = window.prompt(
    'Pega aquí la URL de tu Apps Script (termina en /exec).\nDéjalo vacío y acepta para desactivar la sincronización.',
    currentUrl
  );
  if (url === null) return;
  const key = url.trim() ? window.prompt('Ahora pega la clave secreta que puso en el código (CLAVE_SECRETA):', currentKey) : '';
  try {
    await window.storage.set(SYNC_URL_KEY, url.trim(), false);
    await window.storage.set(SYNC_KEY_KEY, (key || '').trim(), false);
    showToast(url.trim() ? 'Sincronización configurada.' : 'Sincronización desactivada.');
  } catch (err) {
    showToast('No se pudo guardar la configuración de sincronización.');
  }
}

const SYNC_KEY_KEY = 'sheet-sync-secret';

async function getSyncKey() {
  try {
    const result = await window.storage.get(SYNC_KEY_KEY, false);
    return result && result.value ? result.value : '';
  } catch (err) {
    return '';
  }
}

async function pushToSheet(lead) {
  const url = await getSyncUrl();
  if (!url) return;
  const key = await getSyncKey();
  try {
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        clave: key || '',
        nombre: lead.name || '',
        origen: lead.origin || '',
        fecha: lead.lastContact ? lead.lastContact.split('T')[0] : '',
        financiamiento: '',
        interes: lead.presupuesto || '',
        nota: lead.notas || '',
        contacto: lead.phone || '',
        tmovin: '',
        resultado: 'En proceso'
      })
    });
    showToast('Lead agregado y enviado a tu Google Sheet.');
  } catch (err) {
    showToast('Lead guardado aquí, pero no se pudo enviar a Sheets.');
  }
}

document.getElementById('syncBtn').addEventListener('click', configureSync);
document.getElementById('addLeadBtn').addEventListener('click', openAddModal);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('originFilter').addEventListener('change', render);
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

loadLeads();
